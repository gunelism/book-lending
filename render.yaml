# Render Blueprint: one free web service running the root Dockerfile (API + admin in one container).
# Database and covers live in Neon (Postgres + Object Storage); Render provides HTTPS and the
# https://<name>.onrender.com address. Free services sleep after 15 minutes without traffic.
services:
  - type: web
    name: book-lending
    runtime: docker
    plan: free
    region: frankfurt # next to the Neon project (eu-central-1)
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      # Generated by Render (random, 32+ characters)
      - key: SESSION_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      # Copy from your local .env (written by `npx neon@latest deploy`); Render asks for them on creation.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      # Only used if the database is empty on first start (it's seeded from your computer instead).
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_STAFF_PASSWORD
        sync: false
      # Optional: Help chat (free key from console.groq.com/keys); leave empty to turn it off.
      - key: AI_API_KEY
        sync: false
      - key: S3_BUCKET
        value: library-covers
