# Book Lending Library — local stack
#
#   cp .env.example .env      # then edit the secrets
#   docker compose up --build
#   open https://localhost
#
# Services
#   caddy     HTTPS reverse proxy (local CA) + serves the React-Admin build
#   api       NestJS GraphQL API (runs migrations on start)
#   postgres  PostgreSQL 17 (stand-in for a managed DB such as Neon/Supabase/RDS)
#   minio     S3-compatible object storage (MinIO-compatible "silo" build; stand-in for AWS S3 / Cloudflare R2)
#   api-test  e2e test runner, only started with --profile test

name: book-lending

x-api-env: &api-env
  NODE_ENV: production
  PORT: 3000
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  S3_ENDPOINT: http://minio:9000
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET:-library-covers}
  S3_FORCE_PATH_STYLE: "true"
  SESSION_SECRET: ${SESSION_SECRET}
  CSRF_SECRET: ${CSRF_SECRET}
  COOKIE_SECURE: "true"
  PUBLIC_URL: https://localhost
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@library.local}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
  SEED_STAFF_PASSWORD: ${SEED_STAFF_PASSWORD}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/create-test-db.sh:/docker-entrypoint-initdb.d/10-create-test-db.sh:ro
    # Bound to localhost only, handy for psql / a DB GUI.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # MinIO stopped publishing images (Docker Hub repo deleted, quay.io gated, Sept 2026).
    # pgsty/silo is a maintained, drop-in community build of the same server: same
    # command, same MINIO_ROOT_* variables, versioned tags, amd64 + arm64.
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    # MinIO web console (browse the uploaded covers) — localhost only.
    ports:
      - "127.0.0.1:9001:9001"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    # Not published to the host: only reachable through Caddy over HTTPS.
    expose:
      - "3000"

  caddy:
    build:
      context: .
      dockerfile: docker/caddy/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: test
    environment:
      <<: *api-env
      NODE_ENV: test
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/library_test
      S3_BUCKET: library-covers-test
      COOKIE_SECURE: "false"
      PUBLIC_URL: http://localhost
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  pgdata:
  miniodata:
  caddy_data:
  caddy_config:
